version: "3"
silent: true

vars:
  APPHOST: ./Ogma3.AppHost/Ogma3.AppHost.csproj

tasks:
  watch: dotnet watch --project {{.APPHOST}} -- --allow-dirty=true

  watch-dbg:
    env:
      Microsoft_CodeAnalysis_EditAndContinue_LogDir: '{{.TASKFILE_DIR | toSlash}}/.logs/{{now | date "2006-01-02_15-04-05"}}'
    cmds:
      - echo "Logging to $Microsoft_CodeAnalysis_EditAndContinue_LogDir"
      - dotnet watch --verbose --project {{.APPHOST}} -- --allow-dirty=true

  run-prod: dotnet run -c release --project {{.APPHOST}} -- --emulate-prod

  # Generate JS API clients based on Swagger
  paths:
    env:
      DENO_TLS_CA_STORE: system
    vars:
      DEST: ./Ogma3/FrontendCode/typescript/generated/
      URL: https://localhost:5001/openapi/
    cmds:
      - ogma-tool generate-paths {{.DEST}} --path.public="{{.URL}}public.json" --path.internal="{{.URL}}internal.json"

  # Generate preload code for fonts
  preloads:
    vars:
      SRC: ./Ogma3/wwwroot/fonts
      DEST: fonts
    cmds:
      - ogma-tool generate-preloads {{.SRC}} {{.DEST}}

  # Generate CSS import conde for fonts
  imports:
    vars:
      SRC: ./Ogma3/wwwroot/fonts
      DEST: fonts
    cmds:
      - ogma-tool generate-imports {{.SRC}} {{.DEST}}

  # Check the size of the bundle
  bundlesize:
    vars:
      SRC: ./Ogma3/wwwroot/js/*.js ./Ogma3/wwwroot/js/**/*.js
    cmds:
      - ogma-tool bundle-size {{.SRC}}

  # EF helpers
  db-migrate:
    aliases: [ dbm ]
    cmds:
      - dotnet ef migrations add {{.CLI_ARGS}}

  db-unmigrate:
    aliases: [ dbu ]
    cmds:
      - dotnet ef migrations remove --offline {{.CLI_ARGS}}

  db-compile:
    aliases: [ dbc ]
    prompt: Currently blocked by https://github.com/dotnet/efcore/issues/24897. Do you want to continue?
    cmds:
      - dotnet ef dbcontext optimize --output-dir CompiledModels --namespace CompiledModels {{.CLI_ARGS}}

  # Frontend
  build-front:
    dir: ./Ogma3/FrontendCode
    cmd: bun run --parallel "*:prod" fonts
  watch-front:
    dir: ./Ogma3/FrontendCode
    cmd: bun run --parallel "*:watch"

  # Deploy
  deploy:
    cmds:
      - task: build-front
      - aspire deploy -e Production

  bump:patch: dotnet run --file ./.scripts/Bump.cs -- patch
  bump:minor: dotnet run --file ./.scripts/Bump.cs -- minor
  bump:major: dotnet run --file ./.scripts/Bump.cs -- major

  ngrok: ngrok http https://localhost:5001

  aspire-update: aspire update --self --channel stable && aspire update