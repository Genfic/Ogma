name: Bun Dependabot
description: |
  Dependabot cannot parse `bun.lock` for transitive dependencies. This action should fix that.
  Taken from https://charpeni.com/blog/the-bun-dependabot-gap-dependabot-alerts-dont-see-bun-lock

on:
  push:
    paths:
      - '**/bun.lock'
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: charpeni/bun-lock-submission@7d54432cdbf56ed02aaf95b31f810d867ec45e5b # v1
