name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_USE_MODERN_OUTPUT: true
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
          source-url: https://nuget.pkg.github.com/atulin/index.json

      - name: Restore dependencies
        run: dotnet restore -c Release

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release -- --coverage --coverage-output-format cobertura

      - name: Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b
        with:
          format: cobertura
          files: "**/*.cobertura.xml"
