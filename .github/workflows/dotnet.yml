name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_USE_MODERN_OUTPUT: true
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
          source-url: https://nuget.pkg.github.com/atulin/index.json

      - name: Validate SonarQube token
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN secret is not configured."
            exit 1
          fi

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin SonarQube analysis
        run: >-
          dotnet sonarscanner begin
          /k:"Genfic_Ogma"
          /o:"genfic"
          "/d:sonar.token=$SONAR_TOKEN"

      - name: Restore dependencies
        run: dotnet restore -p:Configuration=Release -r linux-x64

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release -- --coverage --coverage-output-format cobertura

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b
        with:
          format: cobertura
          files: "**/*.cobertura.xml"
