name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-deployed:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check for a successful deployment of this tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already_deployed=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?per_page=100" \
            | jq -s --arg tag "$GITHUB_REF_NAME" --arg run_id "$GITHUB_RUN_ID" \
              'any(.[].workflow_runs[]; .head_branch == $tag and .conclusion == "success" and (.id | tostring) != $run_id)')

          if [ "$already_deployed" = "true" ]; then
            echo "Tag $GITHUB_REF_NAME has already been deployed successfully."
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-deployed
    if: needs.check-deployed.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_PAT }}

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/atulin/index.json

      - name: Install Aspire CLI
        run: dotnet tool install -g aspire.cli --version 13.6.4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H "${TARGET_HOST}" >> ~/.ssh/known_hosts
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}

      - name: Install frontend dependencies
        working-directory: FrontendCode
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: FrontendCode
        run: bun run --parallel "*:prod" fonts

      - name: Deploy with Aspire
        run: aspire deploy -e Production
        env:
          DockerSSH__TargetHost: ${{ secrets.TARGET_HOST }}
          DockerSSH__SshUsername: ${{ secrets.SSH_USERNAME }}
          DockerRegistry__RegistryUsername: ${{ github.actor }}
          DockerRegistry__RegistryPassword: ${{ secrets.GITHUB_TOKEN }}
          Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
          Parameters__garnet-password: ${{ secrets.GARNET_PASSWORD }}
          Parameters__infisical-project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          Parameters__infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          Parameters__infisical-machine-id: ${{ secrets.INFISICAL_MACHINE_ID }}