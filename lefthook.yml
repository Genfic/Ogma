assert_lefthook_installed: true
pre-commit:
  parallel: true
  jobs:
    - name: Frontend Checks
      root: "FrontendCode"
      group:
        jobs:
          - name: Lint TS
            run: bun run lint:fix -- --quiet || true
          - name: Format TS
            run: bun run format:fix || true
          - name: Typecheck
            run: bun run js:typecheck || true
          - name: Lint SCSS
            run: bun run css:lint || true
          - name: Webtypes
            run: bun run webtypes || true
