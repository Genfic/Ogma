assert_lefthook_installed: true
pre-commit:
  jobs:
    - name: Lint TS
      root: "FrontendCode"
      run: bun run lint:fix -- --quiet
      stage_fixed: true
    - name: Webtypes
      root: "FrontendCode"
      run: bun run webtypes
      files: git ls-files -- FrontendCode/web-types.json
      stage_fixed: true
    - name: Format TS
      root: "FrontendCode"
      run: bun run format:fix
      stage_fixed: true
    - name: Lint SCSS
      root: "FrontendCode"
      run: bun run css:lint
    - name: Typecheck
      root: "FrontendCode"
      run: bun run js:typecheck
